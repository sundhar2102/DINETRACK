<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="st_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81E1E"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="st_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- App Icon Background -->
  <rect width="120" height="120" rx="30" fill="url(#st_grad)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="none" stroke="url(#st_glow)" stroke-width="2"/>
  
  <!-- Smart Table Top Geometry -->
  <ellipse cx="60" cy="54" rx="36" ry="16" fill="#0F172A"/>
  <ellipse cx="60" cy="54" rx="34" ry="14" fill="#1E293B" stroke="#C81E1E" stroke-width="2"/>

  <!-- Center Plate with Smart Pulse -->
  <circle cx="60" cy="54" r="10" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="60" cy="54" r="6" fill="#C81E1E"/>
  <circle cx="60" cy="54" r="2.5" fill="#FFFFFF"/>

  <!-- Cutlery accents -->
  <path d="M36 46 L36 62 M34 46 L34 52 M38 46 L38 52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 46 L84 62 M84 46 C87 46 87 53 84 55" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Table Legs & Stand -->
