name: Smart Table Enterprise CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smarttable-ci:
    name: 🚀 Smart Table Unified Enterprise CI / CD
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Backend & Frontend Dependencies
        run: |
          npm --prefix backend install
          npm --prefix frontend install
          npm --prefix e2e-tests install

      - name: 🗄️ Seed SQLite Database
        run: |
          cd backend
          npm run seed

      - name: 🚀 Start Backend API Daemon
        run: |
          cd backend
          npm start &
          npx --yes wait-on http://127.0.0.1:5000/api/health -t 30000

      - name: 🧪 Execute Backend Integration & Deep Domain Tests (22 Tests)
        run: |
          cd backend
          npm run test:all

      - name: 💻 Build Web Frontend Production Bundle (Vite)
        run: |
          cd frontend
          npm run build

      - name: 🐦 Setup Flutter 3.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies & Static Analysis
        run: |
          flutter pub get
          flutter analyze

      - name: 📱 Execute Flutter Mobile Unit & Widget Tests (15 Tests)
        run: |
          flutter test test/widget_test.dart test/customer_home_test.dart test/owner_auth_test.dart

      - name: 📊 Execute 356 Multi-Type E2E Matrix & Generate Excel Analytics
        run: |
          cd e2e-tests
          npm test

      - name: 📤 Upload Excel Analytics Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTable-Excel-Quality-Reports
          path: e2e-tests/test-results/SmartTable_E2E_Test_Report.xlsx
          retention-days: 30
          if-no-files-found: error
