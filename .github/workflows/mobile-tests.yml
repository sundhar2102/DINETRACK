name: Appium Mobile Android E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mobile-tests:
    name: 📱 Appium Android Mobile E2E (100+ Tests)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Root Dependencies
        run: npm ci

      - name: 📦 Install Backend & Frontend Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: 🗄️ Initialize Test Database
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_db
          DB_PORT: 3306
        run: |
          cd backend
          npm run db:init || true

      - name: 🚀 Start Backend Server
        env:
          PORT: 5000
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_db
          DB_PORT: 3306
        run: |
          cd backend
          npm run start &
          npx wait-on http://127.0.0.1:5000/api/health -t 30000

      - name: 🏗️ Build React/Vite Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://10.0.2.2:5000/api

      - name: 🔄 Capacitor Sync Android
        run: |
          cd frontend
          npx cap sync android

      - name: 🔨 Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📱 Install Appium & UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed

      - name: 🏃 Start Appium Server
        run: |
          appium --log appium.log &
          npx wait-on http://127.0.0.1:4723/status -t 30000

      - name: 🤖 Run Android Emulator and Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb devices
            APK_PATH=$(find frontend/android -name "*.apk" | head -n 1)
            echo "Actual APK Path: $APK_PATH"
            export APK_PATH=$APK_PATH
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              npm run test:mobile
            else
              npm run test:mobile:smoke
            fi

      - name: 📊 Execute Mobile Test Audit & Validation
        if: always()
        run: |
          node scripts/validate-test-count.js
          npm run report:excel

      - name: 📤 Upload Mobile Test Quality Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Appium-Quality-Report
          path: |
            test-reports/
            appium.log
          retention-days: 30
